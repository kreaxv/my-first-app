name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Check code
        run: |
          flutter analyze
          flutter test

      - name: Build unsigned iPhone app
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p build/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          cd build/ipa
          /usr/bin/zip -qry HelloWorld-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-IPA
          path: build/ipa/HelloWorld-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
